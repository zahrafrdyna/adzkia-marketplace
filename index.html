<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>market place, product-card</h1>
      <nav>
        <a href="#product">product</a>
        <a id="keranjang">keranjang (<span id="cart-cont">0</span>)</a>
        <a></a>
      </nav>
    </header>
    <main>
      <div class="product-grid" id="product">
        <div class="product-card">
          <img src="gambar/jam.jpg" alt="gambar" />
          <h3>JAM bunga</h3>
          <p class="price">RP 300.000</p>
          <div class="qty-steper">
            <button type="button" class="btn-min">-</button>
            <input type="text" class="qty-value" value="1" reandonly />
            <button type="button" class="btn-plus">+</button>
          </div>
          <button class="buy-btn" data-nama="jam bunga">beli sekarang</button>
        </div>

        <div class="product-card">
          <img src="gambar/lampu.jpg" alt="gambar" />
          <h3>lampu tidur lily</h3>
          <p class="price">RP 200.000</p>
          <div class="qty-steper">
            <button type="button" class="qty-btn btn-min">-</button>
            <input type="text" class="qty-value" value="1" readonly />
            <button type="button" class="qty-btn btn-plus">+</button>
          </div>
          <button class="buy-btn" data-nama="lampu tidur lily">
            beli sekarang
          </button>
        </div>

        <div class="product-card">
          <img src="gambar/glas.jpg" alt="gambar" />
          <h3>gelas bungaa</h3>
          <p class="price">RP 90.000</p>
          <div class="qty-steper">
            <button type="button" class="qty-btn btn-min">-</button>
            <input type="text" class="qty-value" value="1" readonly />
            <button type="button" class="qty-btn btn-plus">+</button>
          </div>
          <button class="buy-btn" data-nama="gelas bungaa">
            beli sekarang
          </button>
        </div>

        <div class="product-card">
          <img src="gambar/hiasan.jpg" alt="gambar" />
          <h3>hiasan kamar</h3>
          <p class="price">RP 50.000</p>
          <div class="qty-steper">
            <button type="button" class="qty-btn btn-min">-</button>
            <input type="text" class="qty-value" value="1" readonly />
            <button type="button" class="qty-btn btn-plus">+</button>
          </div>
          <button
            class="buy-btn"
            data-nama="hiasan kamar"
            beli
            sekarang
          ></button>
        </div>

        <div class="product-card">
          <img src="gambar/kaca.jpg" alt="gambar" />
          <h3>kaca bunga</h3>
          <p class="price">RP 1.000.000</p>
          <div class="qty-steper">
            <button type="button" class="qty-btn btn-min">-</button>
            <input type="text" class="qty-value" value="1" readonly />
            <button type="button" class="qty-btn btn-plus">+</button>
          </div>
          <button class="buy-btn" data-nama="kaca bunga">beli sekarang</button>
        </div>
      </div>
    </main>
    <footer>
      <h2>hubungi kami</h2>
      <form class="kontak">
        <label for="nama">name:</label>
        <input type="text" id="email" placeholder="full name" />
        <label for="email">email:</label>
        <input type="email" id="email" placeholder="email" />
        <label for="pesan">pesan:</label>
        <textarea
          type="text"
          placeholder="masukan pesan yang igin di sampaikan"
        ></textarea>
        <button class="btn-kirim">kirim pesan</button>
      </form>
      <h1>copyright by adzkiaa</h1>
    </footer>
    <script src="script.js"></script>
  </body>
</html>
